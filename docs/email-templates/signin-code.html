<!-- Anchor sign-in code — paste into Supabase → Authentication → Emails → Magic Link.
     Table-based layout with inline styles: the only thing email clients render reliably.
     Dark card on a light backdrop so it looks right in both light and dark inboxes. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 12px;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#09090b;border-radius:14px;overflow:hidden;">

        <!-- header -->
        <tr>
          <td style="padding:32px 32px 8px;text-align:center;">
            <div style="display:inline-block;width:44px;height:44px;line-height:44px;border-radius:12px;background:#18181b;color:#0ea5e9;font-size:22px;">&#9875;</div>
            <div style="margin-top:12px;color:#fafafa;font-size:19px;font-weight:600;letter-spacing:-0.2px;">Anchor</div>
          </td>
        </tr>

        <!-- code -->
        <tr>
          <td style="padding:20px 32px 8px;text-align:center;">
            <p style="margin:0 0 18px;color:#a1a1aa;font-size:14px;line-height:22px;">
              Here's your sign-in code. Type it into Anchor to finish signing in.
            </p>
            <div style="background:#18181b;border:1px solid #27272a;border-radius:10px;padding:18px 12px;">
              <span style="color:#fafafa;font-size:32px;font-weight:700;letter-spacing:10px;font-family:'Consolas','SF Mono',Menlo,monospace;">{{ .Token }}</span>
            </div>
            <p style="margin:14px 0 0;color:#71717a;font-size:12px;line-height:18px;">
              Expires in 1 hour &middot; single use
            </p>
          </td>
        </tr>

        <!-- divider -->
        <tr>
          <td style="padding:24px 32px 0;">
            <div style="height:1px;background:#27272a;line-height:1px;">&nbsp;</div>
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td style="padding:16px 32px 30px;text-align:center;">
            <p style="margin:0 0 6px;color:#71717a;font-size:12px;line-height:19px;">
              Didn't request this? You can ignore this email — nobody can sign in without the code.
            </p>
            <p style="margin:0;color:#52525b;font-size:11px;line-height:18px;">
              Anchor &middot; open-source Windows optimization
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
